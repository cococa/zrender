<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Filler Test</title>
    <script src="../dist/zrender.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
        .chart {
            width: 300px;
            height: 300px;
            border: 1px solid #eee;
            margin: 10px;
            float: left;
        }
    </style>
</head>
<body>
    <h2>Filler Test</h2>
    <div id="hachure" class="chart"></div>
    <div id="zigzag" class="chart"></div>
    <div id="cross-hatch" class="chart"></div>
    <div id="dots" class="chart"></div>
    <div id="dashed" class="chart"></div>
    <div id="zigzag-line" class="chart"></div>

    <script>
        function createChart(id, filler) {
            var zr = zrender.init(document.getElementById(id), {
                renderer: 'canvas',
                roughness: 1,
                filler: filler
            });

            var circle = new zrender.Circle({
                shape: {
                    cx: 150,
                    cy: 150,
                    r: 100
                },
                style: {
                    fill: 'red',
                    stroke: 'black'
                }
            });
            zr.add(circle);
        }

        createChart('hachure', 'hachure');
        createChart('zigzag', 'zigzag');
        createChart('cross-hatch', 'cross-hatch');
        createChart('dots', 'dots');
        createChart('dashed', 'dashed');
        createChart('zigzag-line', 'zigzag-line');
    </script>
</body>
</html>
