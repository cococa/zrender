<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Test Isogon</title>
    <script src="../../dist/zrender.js"></script>
</head>
<body>
    <div id="main" style="width: 1000px; height: 600px;"></div>
    <script type="text/javascript">
        var zr = zrender.init(document.getElementById('main'), {
            roughness: 1
        });

        var shape = new zrender.Isogon({
            shape: {
                x: 300,
                y: 300,
                r: 100,
                n: 6
            },
            style: {
                stroke: '#000',
                fill: 'rgba(255, 255, 0, 0.2)',
                lineWidth: 2
            }
        });
        zr.add(shape);
    </script>
</body>
</html>
