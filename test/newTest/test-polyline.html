<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Test Polyline</title>
    <script src="../../dist/zrender.js"></script>
</head>
<body>
    <div id="main" style="width: 1000px; height: 600px;"></div>
    <script type="text/javascript">
        var zr = zrender.init(document.getElementById('main'), {
            roughness: 1
        });

        var shape = new zrender.Polyline({
            shape: {
                points: [[100, 100], [200, 200], [300, 100], [400, 300], [500, 200]]
            },
            style: {
                stroke: '#000',
                fill: null,
                lineWidth: 2
            }
        });
        zr.add(shape);
    </script>
</body>
</html>
