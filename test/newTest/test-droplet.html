<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Test Droplet</title>
    <script src="../../dist/zrender.js"></script>
</head>
<body>
    <div id="main" style="width: 1000px; height: 600px;"></div>
    <script type="text/javascript">
        var zr = zrender.init(document.getElementById('main'), {
            roughness: 1
        });

        var shape = new zrender.Droplet({
            shape: {
                cx: 300,
                cy: 300,
                width: 80,
                height: 120
            },
            style: {
                stroke: '#000',
                fill: 'rgba(0, 0, 255, 0.2)',
                lineWidth: 2
            }
        });
        zr.add(shape);
    </script>
</body>
</html>
