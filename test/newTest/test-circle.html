<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Test Circle</title>
    <script src="../../dist/zrender.js"></script>
</head>
<body>
    <div id="main" style="width: 1000px; height: 600px;"></div>
    <script type="text/javascript">
        var zr = zrender.init(document.getElementById('main'), {
            roughness: 1,
            filler: 'zigzag',
            renderer: 'svg' 
        });

        var shape = new zrender.Circle({
            shape: {
                cx: 300,
                cy: 300,
                r: 100
            },
            style: {
                stroke: '#000',
                fill: 'red',
                lineWidth: 2
            }
        });
        zr.add(shape);
    </script>
</body>
</html>
