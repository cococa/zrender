<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8" />
    <title>Test Rect</title>
    <script src="../../dist/zrender.js"></script>
</head>
<body>
    <div id="main" style="width: 1000px; height: 600px;"></div>
    <script type="text/javascript">
        var zr = zrender.init(document.getElementById('main'), {
            roughness: 1,
            renderer: 'svg',
            filler: 'cross-hatch'
        });

        var shape = new zrender.Rect({
            shape: {
                x: 100,
                y: 100,
                width: 300,
                height: 200
            },
            style: {
                stroke: 'red',
                fill: 'rgba(128, 0, 128, 0.2)',
                lineWidth: 1
            }
        });
        zr.add(shape);
    </script>
</body>
</html>
